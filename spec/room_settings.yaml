version: 1
defaults:
  max_players: 8
  piece_count: 4
  stacking_enabled: true
  capture_extra_throw: always
  yut_mo_extra_throw: true
  shortcut_policy: selectable
  backdo_enabled: true
  buk_mode_enabled: false
  random_buk_destination: false
  movement_order: free
  throw_timeout_seconds: 20
  move_timeout_seconds: 90

allowed:
  max_players: [2, 4, 6, 8]
  piece_count: [2, 3, 4]
  capture_extra_throw:
    - always
    - do_to_geol_plus_special
    - none
  shortcut_policy:
    - forced
    - selectable
  movement_order:
    - fifo
    - free
  throw_timeout_seconds: [10, 20, 30]
  move_timeout_seconds: [30, 60, 90, 120, 150]

constraints:
  - random_buk_destination may be true only when buk_mode_enabled is true
  - teams must have equal player counts to start
  - minimum total player count is 2
  - all players must be ready
  - player plus spectator count must not exceed 20

creation:
  title:
    required: true
    min_graphemes: 1
    max_graphemes: 25
  password:
    required: false
    pattern: "^[0-9a-zA-Z]{4,16}$"
