<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>북윷놀이 WASM 프로토타입</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #241d19;
      color: #fffaf0;
    }

    * { box-sizing: border-box; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 1280px);
    }

    .auth {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      margin-bottom: 14px;
    }

    .auth-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      padding: 9px 14px;
      border: 1px solid #ad8e78;
      border-radius: 8px;
      background: #fffaf0;
      color: #241d19;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #f5efe1;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgb(0 0 0 / 35%);
    }

    .bridge {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .chat {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #6f5b4e;
      border-radius: 12px;
      background: rgb(255 250 240 / 8%);
    }

    .chat h2 { margin: 0; font-size: 1.05rem; }

    #chat-messages {
      min-height: 96px;
      max-height: 220px;
      margin: 0;
      padding: 12px 12px 12px 32px;
      overflow-y: auto;
      border-radius: 8px;
      background: rgb(0 0 0 / 22%);
    }

    #chat-messages li { margin: 4px 0; overflow-wrap: anywhere; }

    #chat-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    label { font-weight: 700; }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ad8e78;
      border-radius: 8px;
      font: inherit;
    }

    output {
      min-height: 1.5em;
      color: #d7f2e5;
      overflow-wrap: anywhere;
    }

    #status { color: #d6c4b7; }
    #realtime-status { display: block; color: #d6c4b7; }
    #chat-status { color: #d6c4b7; }

    .lobby {
      display: grid;
      gap: 10px;
      margin: 18px 0;
      padding: 16px;
      border: 1px solid #6f5b4e;
      border-radius: 12px;
      background: rgb(255 250 240 / 8%);
    }

    .lobby-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .lobby h2 { margin: 0; font-size: 1.05rem; }
    #room-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    #room-list li { padding: 12px; border-radius: 8px; background: rgb(0 0 0 / 22%); }
    .room-row { display: flex; justify-content: space-between; gap: 12px; }
    .room-meta { color: #d6c4b7; font-size: .9rem; overflow-wrap: anywhere; }
    .room-actions, .room-create { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .room-create input, .room-create select { width: auto; min-width: 120px; padding: 8px 10px; }
    .room-detail { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid #6f5b4e; }
    #room-detail-title, #room-members, .room-row strong { overflow-wrap: anywhere; }
    .room-row strong { max-height: 4.5em; overflow-y: auto; }
    #room-detail-title { max-height: 4.5em; overflow-y: auto; }
    #room-members { max-height: 12rem; overflow-y: auto; }
    .game-logs { display: grid; gap: 6px; }
    .game-logs h3 { margin: 0; font-size: 1rem; }
    #game-log-list { max-height: 12rem; margin: 0; padding: 10px 10px 10px 28px; overflow-y: auto; border-radius: 8px; background: rgb(0 0 0 / 22%); }
    #game-log-list li { overflow-wrap: anywhere; }
    #game-log-list ol { margin: 6px 0 0; padding-left: 20px; }
    .room-detail[hidden] { display: none; }
    .room-lobby-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .game-session { display: grid; gap: 6px; margin: 18px 0; padding: 14px 16px; border: 1px solid #6f5b4e; border-radius: 12px; background: rgb(255 250 240 / 8%); }
    .game-session[hidden] { display: none; }

    @media (max-width: 720px) {
      body { padding: 12px; place-items: start center; }
      .auth, .lobby-header { align-items: stretch; flex-direction: column; gap: 10px; }
      .auth-actions, .auth-actions button, .lobby-header button { width: 100%; }
      .room-row { align-items: flex-start; flex-direction: column; gap: 4px; }
      .room-create { display: grid; grid-template-columns: 1fr; }
      .room-create input, .room-create select, .room-create button { width: 100%; min-width: 0; }
      .room-actions, .room-lobby-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      button, input, select { min-height: 44px; }
      .room-actions button, .room-lobby-actions button { min-width: 0; }
      #chat-form { grid-template-columns: 1fr; }
      #chat-form button { min-height: 44px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="auth" aria-label="로그인">
      <div>
        <span id="auth-status" role="status">세션 확인 중…</span>
        <span id="realtime-status" role="status">로그인 후 실시간 연결</span>
      </div>
      <div class="auth-actions">
        <div id="google-signin"></div>
        <button id="logout" type="button" hidden>로그아웃</button>
      </div>
    </section>
    <section class="lobby" aria-labelledby="lobby-heading">
      <div class="lobby-header">
        <h2 id="lobby-heading">공개 방 목록</h2>
        <button id="room-refresh" type="button" disabled>새로고침</button>
      </div>
      <span id="room-list-status" role="status">로그인 후 방 목록을 확인할 수 있습니다.</span>
      <ul id="room-list" aria-live="polite" aria-label="공개 방 목록"></ul>
      <form id="room-create-form" class="room-create">
        <label class="visually-hidden" for="room-title">방 제목</label>
        <input id="room-title" type="text" maxlength="25" placeholder="방 제목" disabled required>
        <label class="visually-hidden" for="room-password">방 비밀번호</label>
        <input id="room-password" type="password" maxlength="16" placeholder="비밀번호(선택)" disabled>
        <label class="visually-hidden" for="room-team">팀</label>
        <select id="room-team" disabled><option value="A">A팀</option><option value="B">B팀</option></select>
        <button id="room-create" type="submit" disabled>방 만들기</button>
      </form>
      <div id="room-detail" class="room-detail" hidden aria-live="polite">
        <strong id="room-detail-title"></strong>
        <span id="room-detail-status" class="room-meta"></span>
        <div class="room-lobby-actions" aria-label="방 로비 조작">
          <button id="room-team-a" type="button" disabled>A팀 선택</button>
          <button id="room-team-b" type="button" disabled>B팀 선택</button>
          <button id="room-ready" type="button" disabled>준비</button>
          <button id="room-start" type="button" disabled>게임 시작</button>
          <button id="room-confirm-start" type="button" disabled>시작 확인</button>
      <button id="room-add-cpu-a" type="button" disabled>A팀 CPU 추가</button>
      <button id="room-add-cpu-b" type="button" disabled>B팀 CPU 추가</button>
        </div>
        <span id="room-lobby-status" role="status"></span>
        <ul id="room-members" aria-label="방 멤버"></ul>
        <section class="game-logs" aria-labelledby="game-log-heading">
          <h3 id="game-log-heading">완료한 경기 기록</h3>
          <span id="game-log-status" class="room-meta" role="status">방 상세를 불러온 뒤 경기 기록을 확인합니다.</span>
          <ol id="game-log-list" aria-live="polite" aria-label="완료한 경기 기록"></ol>
        </section>
      </div>
    </section>
    <section id="game-session" class="game-session" hidden aria-live="polite" aria-label="게임 화면 상태">
      <strong id="game-session-title">게임 화면</strong>
      <span id="game-session-status" class="room-meta"></span>
    </section>
    <canvas id="canvas" width="1280" height="720" tabindex="-1"
            oncontextmenu="event.preventDefault()"></canvas>
    <section class="bridge" aria-labelledby="ime-label">
      <label id="ime-label" for="ime-input">한글 IME → C/WASM 왕복 확인</label>
      <input id="ime-input" type="text" maxlength="200" autocomplete="off"
             placeholder="예: 안녕하세요, 윷놀이!" disabled>
      <output id="echo" for="ime-input" aria-live="polite"></output>
      <span id="status" role="status">WASM 초기화 중…</span>
    </section>
    <section class="chat" aria-labelledby="chat-heading">
      <h2 id="chat-heading">로비 전체 채팅</h2>
      <ol id="chat-messages" aria-live="polite" aria-label="채팅 메시지"></ol>
      <form id="chat-form">
        <label class="visually-hidden" for="chat-input">채팅 메시지</label>
        <input id="chat-input" type="text" autocomplete="off"
               placeholder="한국어 메시지 (최대 200자)" disabled>
        <button id="chat-send" type="submit" disabled>전송</button>
      </form>
      <span id="chat-status" role="status">로그인 후 채팅할 수 있습니다.</span>
    </section>
  </main>

  <script>
    const input = document.getElementById("ime-input");
    const echo = document.getElementById("echo");
    const status = document.getElementById("status");
    const authStatus = document.getElementById("auth-status");
    const realtimeStatus = document.getElementById("realtime-status");
    const googleSignin = document.getElementById("google-signin");
    const logout = document.getElementById("logout");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const chatSend = document.getElementById("chat-send");
    const chatMessages = document.getElementById("chat-messages");
    const chatStatus = document.getElementById("chat-status");
    const roomRefresh = document.getElementById("room-refresh");
    const roomListStatus = document.getElementById("room-list-status");
    const roomList = document.getElementById("room-list");
    const roomCreateForm = document.getElementById("room-create-form");
    const roomTitle = document.getElementById("room-title");
    const roomPassword = document.getElementById("room-password");
    const roomTeam = document.getElementById("room-team");
    const roomCreate = document.getElementById("room-create");
    const roomDetail = document.getElementById("room-detail");
    const roomDetailTitle = document.getElementById("room-detail-title");
    const roomDetailStatus = document.getElementById("room-detail-status");
    const roomTeamA = document.getElementById("room-team-a");
    const roomTeamB = document.getElementById("room-team-b");
    const roomReady = document.getElementById("room-ready");
    const roomStart = document.getElementById("room-start");
    const roomConfirmStart = document.getElementById("room-confirm-start");
  const roomAddCPUA = document.getElementById("room-add-cpu-a");
  const roomAddCPUB = document.getElementById("room-add-cpu-b");
    const roomLobbyStatus = document.getElementById("room-lobby-status");
    const gameLogStatus = document.getElementById("game-log-status");
    const gameLogList = document.getElementById("game-log-list");
    const gameSession = document.getElementById("game-session");
    const gameSessionTitle = document.getElementById("game-session-title");
    const gameSessionStatus = document.getElementById("game-session-status");
    const roomMembers = document.getElementById("room-members");
    const LOBBY_CHAT_ROOM_ID = "lobby";
    const MAX_CHAT_CODE_POINTS = 200;
    const MAX_RENDERED_CHAT_MESSAGES = 100;
    const REALTIME_RECONNECT_DELAYS_MS = [250, 500, 1000, 2000, 5000];
    const MATCH_STATUSES = new Set(["starting", "active", "paused", "finished", "invalid"]);
    const TURN_PHASES = new Set([
      "turn_start", "wait_throw", "throwing_chain", "resolve_queue",
      "wait_result_selection", "wait_piece_selection", "wait_route_selection",
      "apply_move", "resolve_stack_capture_finish", "resolve_buk", "cpu_control",
      "paused", "turn_end", "match_end",
    ]);
    const REQUIRED_INPUTS = new Set([
      "none", "throw", "select_result", "select_piece", "select_route",
    ]);
    const TIMER_PHASES = new Set(["throw", "move", "paused", "none"]);
    const PIECE_STATES = new Set(["waiting", "on_board", "home_checkpoint", "finished"]);
    const RESULTS = new Set(["do", "gae", "geol", "yut", "mo", "backdo", "buk"]);
    const RESULT_ORIGINS = new Set(["initial_throw", "yut_extra", "mo_extra", "capture_extra"]);
    const PARTICIPANT_ROLES = new Set(["player", "spectator"]);
    const PERMISSIONS = new Set(["control_game", "chat", "pause_game", "manage_room"]);
    const CPU_REASONS = new Set(["disconnected", "timeout", "lobby_player", null]);
    const ROUTES = new Set(["normal", "shortcut"]);
    let composing = false;
    let chatComposing = false;
    let realtimeSocket = null;
    let realtimeReconnectEnabled = false;
    let realtimeReconnectAttempt = 0;
    let realtimeReconnectTimer = null;
    let stateReconnectScope = null;
    let fullResynchronizationAttempted = false;
    let authenticatedUserId = null;
    let wasmRuntimeReady = false;
    const pendingChatCommands = new Set();
    const pendingSynchronizationCommands = new Map();
    const pendingRouteCommands = new Map();
    const pendingLobbyCommands = new Map();
    const pendingStartConfirmationCommands = new Map();
    let confirmedSnapshotPieceIds = [];
    let confirmedRouteRequest = null;
    let routeIntentTimer = null;
    let eventCue = null;
    let lastGameEventSequence = 0;
    let roomListAuthenticated = false;
    let roomListRequestGeneration = 0;
    let roomDetailRequestGeneration = 0;
    let activeRoomId = null;
    let activeRoomRole = null;
    let activeStartScope = null;
    let activeViewerRole = null;

    function setRoomEntryEnabled(enabled) {
      for (const element of [roomTitle, roomPassword, roomTeam, roomCreate]) element.disabled = !enabled;
      roomRefresh.disabled = !enabled;
    }

    function setRoomLobbyControls(enabled, member = null) {
      const player = enabled && member?.role === "player";
      roomTeamA.disabled = !player;
      roomTeamB.disabled = !player;
      roomReady.disabled = !player;
      roomStart.disabled = !enabled;
      roomConfirmStart.disabled = !player || activeStartScope?.roomId !== activeRoomId;
    roomAddCPUA.disabled = true;
    roomAddCPUB.disabled = true;
      if (!player) roomReady.textContent = "준비";
    }

    function validateJoinedRoom(payload) {
      return validateRoomSummary(payload) && (payload.role === "player" || payload.role === "spectator")
        && (payload.team === undefined || payload.team === "A" || payload.team === "B");
    }

    function validateRoomDetail(payload) {
      return payload && validateRoomSummary(payload.summary) && Array.isArray(payload.members)
        && payload.members.every((member) => member && typeof member.user_id === "string"
          && member.user_id.length > 0 && typeof member.nickname === "string" && member.nickname.length > 0
          && ["player", "spectator"].includes(member.role)
          && (member.team === undefined || member.team === "A" || member.team === "B")
          && typeof member.ready === "boolean"
          && (member.is_cpu === undefined || typeof member.is_cpu === "boolean")
          && (member.is_host === undefined || typeof member.is_host === "boolean"))
        && (payload.active_start === undefined || (payload.active_start && typeof payload.active_start.match_id === "string"
          && payload.active_start.match_id.length > 0 && typeof payload.active_start.confirmation_deadline_at === "string"
          && payload.active_start.confirmation_deadline_at.length > 0))
        && (payload.active_match === undefined || (payload.active_match && typeof payload.active_match.match_id === "string"
          && payload.active_match.match_id.length > 0))
        && !(payload.active_start && payload.active_match);
    }

    function validateGameLogs(payload) {
      return payload && Array.isArray(payload.game_logs) && payload.game_logs.every((log) => log
        && typeof log.match_id === "string" && log.match_id.length > 0
        && Number.isSafeInteger(log.started_sequence) && log.started_sequence >= 1
        && Number.isSafeInteger(log.ended_sequence) && log.ended_sequence >= log.started_sequence
        && ["finished", "invalid"].includes(log.status)
        && typeof log.reason === "string" && log.reason.length > 0
        && ((log.status === "finished" && ["A", "B"].includes(log.winner_team_id))
          || (log.status === "invalid" && log.winner_team_id === undefined))
        && Array.isArray(log.entries) && log.entries.every((entry) => entry
          && Number.isSafeInteger(entry.sequence) && entry.sequence >= log.started_sequence
          && entry.sequence <= log.ended_sequence && typeof entry.notation === "string" && entry.notation.length > 0));
    }

    function renderGameLogs(logs) {
      gameLogList.replaceChildren();
      if (logs.length === 0) {
        gameLogStatus.textContent = "완료된 경기 기록이 없습니다.";
        return;
      }
      gameLogStatus.textContent = `${logs.length}개의 완료된 경기 기록`;
      for (const log of logs) {
        const item = document.createElement("li");
        const heading = document.createElement("strong");
        heading.textContent = `${log.status === "finished" ? `${log.winner_team_id}팀 승리` : "무효 경기"} · ${log.reason}`;
        const entries = document.createElement("ol");
        for (const entry of log.entries) {
          const line = document.createElement("li");
          line.textContent = entry.notation;
          entries.append(line);
        }
        item.append(heading, entries);
        gameLogList.append(item);
      }
    }

    function renderRoomDetail(detail) {
      roomDetail.hidden = false;
      roomDetailTitle.textContent = detail.summary.title;
      roomDetailStatus.textContent = `${detail.summary.player_count}/${detail.summary.max_players}명${detail.active_start ? " · 시작 확인 중" : detail.active_match ? " · 경기 진행 중" : " · 대기 중"}`;
      const self = detail.members.find((member) => member.user_id === authenticatedUserId);
      activeRoomRole = self?.role ?? null;
      setRoomLobbyControls(roomListAuthenticated && activeRoomId === detail.summary.room_id, self);
    const canEditCPUs = roomListAuthenticated && activeRoomId === detail.summary.room_id
      && self?.is_host === true && !detail.active_start && !detail.active_match;
    roomAddCPUA.disabled = !canEditCPUs;
    roomAddCPUB.disabled = !canEditCPUs;
      if (self?.role === "player") {
        roomReady.textContent = self.ready ? "준비 취소" : "준비";
      }
      if (detail.summary.room_id === activeRoomId && detail.active_match
          && stateReconnectScope === null) {
        // Detail may arrive after a newer lifecycle event. Only an unset scope
        // can be initialized here; a confirmed match scope is never replaced
        // by another detail response.
        activeStartScope = null;
        roomConfirmStart.disabled = true;
        gameSession.hidden = false;
        gameSessionTitle.textContent = "게임 화면";
        gameSessionStatus.textContent = "서버 권위 경기 상태를 동기화하는 중…";
        setStateReconnectScope(detail.summary.room_id, detail.active_match.match_id);
      }
      roomMembers.replaceChildren();
      for (const member of detail.members) {
        const item = document.createElement("li");
    item.textContent = `${member.nickname}${member.is_host ? " · 방장" : ""}${member.is_cpu ? " · CPU" : ""} · ${member.role}${member.team ? ` · ${member.team}팀` : ""} · ${member.ready ? "준비 완료" : "미준비"}`;
    if (canEditCPUs && member.is_cpu) {
      const remove = document.createElement("button");
      remove.type = "button"; remove.textContent = "CPU 제거";
      remove.addEventListener("click", () => sendRoomLobbyCommand("REMOVE_CPU_PLAYER", { player_id: member.user_id }));
      item.append(" ", remove);
    }
        roomMembers.append(item);
      }
    }

    async function loadRoomDetail(roomId, generation) {
      try {
        const response = await fetch(`/api/v1/rooms/${encodeURIComponent(roomId)}`, { credentials: "same-origin", cache: "no-store" });
        if (!response.ok) throw new Error(`room detail request failed: ${response.status}`);
        const payload = await response.json();
        if (generation !== roomDetailRequestGeneration || !roomListAuthenticated) return false;
        if (!validateRoomDetail(payload)) throw new Error("invalid room detail payload");
        renderRoomDetail(payload);
        await loadGameLogs(roomId, generation);
        return true;
      } catch (error) {
        console.error(error);
        if (generation === roomDetailRequestGeneration && roomListAuthenticated) {
          roomDetail.hidden = false;
          roomDetailTitle.textContent = "방 상세를 확인할 수 없습니다.";
          roomDetailStatus.textContent = "방 상세를 불러오지 못했습니다. 다시 시도하세요.";
          roomMembers.replaceChildren();
          gameLogList.replaceChildren();
          gameLogStatus.textContent = "방 상세를 불러오지 못해 경기 기록을 확인할 수 없습니다.";
          setRoomLobbyControls(false);
        }
        return false;
      }
    }

    async function loadGameLogs(roomId, generation) {
      gameLogStatus.textContent = "경기 기록을 불러오는 중…";
      gameLogList.replaceChildren();
      try {
        const response = await fetch(`/api/v1/rooms/${encodeURIComponent(roomId)}/game-logs`, { credentials: "same-origin", cache: "no-store" });
        if (!response.ok) {
          if (generation === roomDetailRequestGeneration && roomListAuthenticated) {
            gameLogStatus.textContent = response.status === 403 || response.status === 404
              ? "경기 기록 조회 권한이 없거나 방이 종료되었습니다."
              : "경기 기록을 불러오지 못했습니다. 다시 시도하세요.";
          }
          return false;
        }
        const payload = await response.json();
        if (generation !== roomDetailRequestGeneration || !roomListAuthenticated) return false;
        if (!validateGameLogs(payload)) throw new Error("invalid game log payload");
        renderGameLogs(payload.game_logs);
        return true;
      } catch (error) {
        console.error(error);
        if (generation === roomDetailRequestGeneration && roomListAuthenticated) {
          gameLogStatus.textContent = "경기 기록을 불러오지 못했습니다. 다시 시도하세요.";
        }
        return false;
      }
    }

    async function enterRoom(roomId, role) {
      if (!roomListAuthenticated) return false;
      roomListStatus.textContent = "방 입장을 처리하는 중…";

            && isCanonicalBoardSpace(piece.actual_previous_space));
    }

    function validateStack(stack) {
      return hasExactKeys(stack, [
        "stack_id", "team_id", "space_id", "piece_ids", "actual_previous_space",
      ]) && isStringId(stack.stack_id) && isTeam(stack.team_id)
        && isCanonicalBoardSpace(stack.space_id)
        && isUniqueStringIdArray(stack.piece_ids, 2)
        && isNullableBoardSpace(stack.actual_previous_space);
    }

    function validatePositionGroup(group) {
      return hasExactKeys(group, ["group_id", "team_id", "space_id", "piece_ids"])
        && isStringId(group.group_id) && isTeam(group.team_id)
        && isCanonicalBoardSpace(group.space_id)
        && isUniqueStringIdArray(group.piece_ids, 1);
    }

    function validatePieceGrouping(snapshot) {
      const piecesById = new Map(snapshot.pieces.map((piece) => [piece.piece_id, piece]));
      const groupIds = new Set(snapshot.position_groups.map((group) => group.group_id));
      const stackIds = new Set(snapshot.stacks.map((stack) => stack.stack_id));
      for (const piece of snapshot.pieces) {
        if (piece.position_group_id !== null && !groupIds.has(piece.position_group_id)) {
          return false;
        }
        if (piece.stack_id !== null && !stackIds.has(piece.stack_id)) return false;
      }
      for (const stack of snapshot.stacks) {
        for (const pieceId of stack.piece_ids) {
          const piece = piecesById.get(pieceId);
          if (!piece || piece.team_id !== stack.team_id || piece.current_space_id !== stack.space_id
              || piece.stack_id !== stack.stack_id || piece.position_group_id === null) {
            return false;
          }
        }
      }
      return true;
    }

    function validateGameSnapshot(snapshot) {
      if (!hasExactKeys(snapshot, [
        "room_id", "match_id", "sequence", "status", "teams", "participants",
        "current_turn", "result_queue", "pieces", "stacks", "position_groups",
        "buk", "pause",
      ]) || !isStringId(snapshot.room_id) || !isStringId(snapshot.match_id)
          || !Number.isSafeInteger(snapshot.sequence) || snapshot.sequence < 1
          || !MATCH_STATUSES.has(snapshot.status)
          || !Array.isArray(snapshot.teams) || snapshot.teams.length !== 2
          || !snapshot.teams.every(validateTeam)
          || new Set(snapshot.teams.map((team) => team.team_id)).size !== 2
          || !Array.isArray(snapshot.participants)
          || !snapshot.participants.every(validateParticipant)
          || !validateCurrentTurn(snapshot.current_turn)
          || !Array.isArray(snapshot.result_queue)
          || !snapshot.result_queue.every(validateResultToken)
          || new Set(snapshot.result_queue.map((token) => token.token_id)).size
             !== snapshot.result_queue.length
          || !Array.isArray(snapshot.pieces) || !snapshot.pieces.every(validatePiece)
          || new Set(snapshot.pieces.map((piece) => piece.piece_id)).size
             !== snapshot.pieces.length
          || !Array.isArray(snapshot.stacks) || !snapshot.stacks.every(validateStack)
          || new Set(snapshot.stacks.map((stack) => stack.stack_id)).size
             !== snapshot.stacks.length
          || !Array.isArray(snapshot.position_groups)
          || !snapshot.position_groups.every(validatePositionGroup)
          || new Set(snapshot.position_groups.map((group) => group.group_id)).size
             !== snapshot.position_groups.length
          || !validatePieceGrouping(snapshot)
          || !hasExactKeys(snapshot.buk, ["enabled", "destination_space_id"])
          || typeof snapshot.buk.enabled !== "boolean"
          || !isNullableBoardSpace(snapshot.buk.destination_space_id)
          || !hasExactKeys(snapshot.pause, ["used", "paused", "ends_at"])
          || typeof snapshot.pause.used !== "boolean"
          || typeof snapshot.pause.paused !== "boolean"
          || (snapshot.pause.ends_at !== null && !isStringId(snapshot.pause.ends_at))) {
        return null;
      }
      const request = snapshot.current_turn.move_request;
      if (request !== null
          && (!request.token_ids.every((id) => snapshot.result_queue.some((token) => token.token_id === id))
              || !request.piece_ids.every((id) => snapshot.pieces.some((piece) => piece.piece_id === id)))) {
        return null;
      }
      const playerId = snapshot.current_turn.player_id;
      const participant = playerId === null ? null
        : snapshot.participants.find((candidate) => candidate.user_id === playerId);
      const team = participant && isTeam(participant.team_id) ? participant.team_id : "";
      return { snapshot, currentTeam: team };
    }

    function routeRequestPresentation(snapshot) {
      const request = snapshot.current_turn.move_request;
      if (request?.required_input !== "select_route") return null;
      const piece = snapshot.pieces.find((candidate) => candidate.piece_id === request.piece_ids[0]);
      if (!piece || (piece.state !== "on_board" && piece.state !== "home_checkpoint")
          || !isCanonicalBoardSpace(piece.current_space_id)) return null;
      const participant = snapshot.participants.find(
        (candidate) => candidate.user_id === snapshot.current_turn.player_id,
      );
      if (!participant || !isTeam(participant.team_id) || piece.team_id !== participant.team_id) {
        return null;
      }
      return {
        roomId: snapshot.room_id,
        matchId: snapshot.match_id,
        tokenId: request.token_ids[0],
        pieceId: request.piece_ids[0],
        routes: [...request.routes],
        originSpaceId: piece.current_space_id,
        playerId: snapshot.current_turn.player_id,
        controlPermitted: snapshot.status === "active" && !snapshot.pause.paused
          && participant?.role === "player"
          && participant.permissions.includes("control_game")
          && participant.cpu_control.active === false,
      };
    }

    function refreshRouteInteraction() {
      if (!wasmRuntimeReady) return false;
      const request = confirmedRouteRequest;
      const scopeMatches = request !== null && stateReconnectScope !== null
        && request.roomId === stateReconnectScope.roomId
        && request.matchId === stateReconnectScope.matchId;
      const enabled = scopeMatches && request.controlPermitted
        && request.playerId === authenticatedUserId && pendingRouteCommands.size === 0
        && realtimeSocket?.readyState === WebSocket.OPEN;
      return Module.ccall(
        "BukClientSetRouteInteractionEnabled", "number", ["number"], [enabled ? 1 : 0],
      ) === 1;
    }

    function cloneSnapshot(snapshot) {
      return JSON.parse(JSON.stringify(snapshot));
    }

    function rebuildReplayGroups(snapshot) {
      const groups = new Map();
      const stacks = new Map();
      for (const stack of snapshot.stacks) stacks.set(stack.stack_id, stack);
      for (const piece of snapshot.pieces) {
        piece.stack_id = null;
        piece.position_group_id = null;
        if ((piece.state !== "on_board" && piece.state !== "home_checkpoint")
            || piece.current_space_id === null) {
          piece.current_space_id = null;
          piece.actual_previous_space = null;
          continue;
        }
        const key = `${piece.team_id}:${piece.state}:${piece.current_space_id}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(piece.piece_id);
        piece.position_group_id = `pos:${piece.team_id}:${piece.state}:${piece.current_space_id}`;
      }
      snapshot.position_groups = [...groups.entries()].map(([key, pieceIds]) => {
        const [teamId, state, spaceId] = key.split(":");
        return { group_id: `pos:${teamId}:${state}:${spaceId}`, team_id: teamId,
          space_id: spaceId, piece_ids: pieceIds };
      });
      snapshot.stacks = [...stacks.values()].flatMap((stack) => {
        const members = stack.piece_ids.map((id) => snapshot.pieces.find((piece) => piece.piece_id === id))
          .filter((piece) => piece && (piece.state === "on_board" || piece.state === "home_checkpoint")
            && piece.team_id === stack.team_id && piece.current_space_id !== null);
        const bySpace = new Map();
        for (const piece of members) {
          if (!bySpace.has(piece.current_space_id)) bySpace.set(piece.current_space_id, []);
          bySpace.get(piece.current_space_id).push(piece.piece_id);
        }
        return [...bySpace.entries()]
          .filter(([, ids]) => ids.length >= 2)
          .map(([spaceId, ids]) => ({ ...stack, space_id: spaceId, piece_ids: ids }));
      });
      for (const stack of snapshot.stacks) {
        for (const id of stack.piece_ids) {
          const piece = snapshot.pieces.find((candidate) => candidate.piece_id === id);
          if (piece) piece.stack_id = stack.stack_id;
        }
      }
      return snapshot;
    }

    function reduceReplayEvents(snapshot, events) {
      const next = cloneSnapshot(snapshot);
      let expected = snapshot.sequence + 1;
      for (const event of events) {
        if (!event || event.version !== 1 || event.direction !== "server_event" || event.room_id !== next.room_id
            || event.match_id !== next.match_id || event.sequence !== expected
            || !event.payload || typeof event.type !== "string") return null;
        const payload = event.payload;
        if (event.type === "YUT_RESULT" && payload.token && typeof payload.player_id === "string") {
          if (!isStringId(payload.token.token_id) || !RESULTS.has(payload.token.result)
              || !RESULT_ORIGINS.has(payload.token.origin)) return null;
          if (!next.result_queue.some((token) => token.token_id === payload.token.token_id)) {
            next.result_queue.push({ ...payload.token, generated_by_player_id: payload.player_id });
          }
        } else if (event.type === "RESULT_QUEUE_UPDATED" && Array.isArray(payload.result_queue)) {
          if (payload.result_queue.length !== 0) return null;
          next.result_queue = [];
        } else if (event.type === "TURN_STARTED" && typeof payload.player_id === "string"
                   && REQUIRED_INPUTS.has(payload.required_input) && TURN_PHASES.has(payload.phase)
                   && Number.isSafeInteger(payload.remaining_ms) && payload.remaining_ms >= 0) {
          next.current_turn.player_id = payload.player_id;
          next.current_turn.phase = payload.phase;
          next.current_turn.required_input = payload.required_input;
          next.current_turn.move_request = null;
          next.current_turn.timer.remaining_ms = payload.remaining_ms;
          next.current_turn.timer.phase = payload.required_input === "throw" ? "throw" : "move";
        } else if (event.type === "MOVE_REQUIRED" && REQUIRED_INPUTS.has(payload.required_input)
                   && Array.isArray(payload.token_ids) && Array.isArray(payload.piece_ids)
                   && Array.isArray(payload.routes)) {
          next.current_turn.required_input = payload.required_input;
          next.current_turn.phase = payload.required_input === "select_route" ? "wait_route_selection"
            : payload.required_input === "select_piece" ? "wait_piece_selection" : "wait_result_selection";
          next.current_turn.move_request = {
            required_input: payload.required_input, token_ids: [...payload.token_ids],
            piece_ids: [...payload.piece_ids], routes: [...payload.routes],
          };
        } else if (event.type === "PIECE_MOVED" && Array.isArray(payload.piece_ids)
                   && payload.piece_ids.length > 0 && isNullableBoardSpace(payload.from_space_id)
                   && isNullableBoardSpace(payload.to_space_id)
                   && ["forward", "backdo", "buk", "finish"].includes(payload.movement_kind)) {
          if (new Set(payload.piece_ids).size !== payload.piece_ids.length) return null;
          for (const id of payload.piece_ids) {
            const piece = next.pieces.find((candidate) => candidate.piece_id === id);
            if (!piece) return null;
            if (payload.from_space_id !== null
                && piece.current_space_id !== payload.from_space_id) return null;
            piece.actual_previous_space = piece.current_space_id;
            piece.current_space_id = payload.to_space_id;
            piece.state = payload.movement_kind === "finish" ? "finished"
              : payload.to_space_id === "chammeogi" ? "home_checkpoint" : "on_board";
          }
          rebuildReplayGroups(next);
        } else if (event.type === "PIECES_CAPTURED" && Array.isArray(payload.captured_piece_ids)
                   && isCanonicalBoardSpace(payload.space_id)) {
          for (const id of payload.captured_piece_ids) {
            const piece = next.pieces.find((candidate) => candidate.piece_id === id);
            if (!piece) return null;
            piece.state = "waiting";
            piece.current_space_id = null;
            piece.stack_id = null;
            piece.position_group_id = null;
            piece.actual_previous_space = null;
          }
          rebuildReplayGroups(next);
        } else if (event.type === "PIECES_STACKED" && typeof payload.stack_id === "string"
                   && Array.isArray(payload.piece_ids) && payload.piece_ids.length >= 2
                   && isCanonicalBoardSpace(payload.space_id)) {
          const stackedPieces = payload.piece_ids.map((id) =>
            next.pieces.find((piece) => piece.piece_id === id));
          if (stackedPieces.some((piece) => !piece)
              || new Set(payload.piece_ids).size !== payload.piece_ids.length
              || stackedPieces.some((piece) => piece.team_id !== stackedPieces[0].team_id)
              || stackedPieces.some((piece) => piece.current_space_id !== payload.space_id)
              || stackedPieces.some((piece) => piece.state !== "on_board" && piece.state !== "home_checkpoint")
              || !isNullableBoardSpace(payload.actual_previous_space)) {
            return null;
          }
          next.stacks = next.stacks.filter((stack) =>
            stack.stack_id !== payload.stack_id
            && !stack.piece_ids.some((id) => payload.piece_ids.includes(id)));
          next.stacks.push({ stack_id: payload.stack_id, team_id: stackedPieces[0].team_id,
            space_id: payload.space_id, piece_ids: [...payload.piece_ids],
            actual_previous_space: payload.actual_previous_space ?? null });
          rebuildReplayGroups(next);
        } else if (event.type === "BUK_RESOLVED" && typeof payload.token_id === "string"
                   && isCanonicalBoardSpace(payload.destination_space_id)
                   && Array.isArray(payload.moved_piece_ids)) {
          // PIECE_MOVED carries the authoritative position mutation; this event is a cue-only marker.
        } else {
          return null;
        }
        next.sequence = event.sequence;
        expected++;
      }
      return next;
    }

    function synchronizationSequences(message) {
      if (message?.version !== 1 || message.direction !== "server_response"
          || message.type !== "COMMAND_RESULT" || message.payload?.status !== "accepted"
          || typeof message.room_id !== "string" || typeof message.match_id !== "string") {
        return null;
      }
      const synchronization = message.payload?.synchronization;
      const snapshot = synchronization?.snapshot;
      const events = synchronization?.events;
      if (!snapshot || !Array.isArray(events)
          || snapshot.room_id !== message.room_id
          || snapshot.match_id !== message.match_id
          || !Number.isSafeInteger(snapshot.sequence) || snapshot.sequence < 1) return null;
      const reduced = events.length === 0 ? snapshot : reduceReplayEvents(snapshot, events);
      return reduced === null ? null : { snapshot: reduced, baseSnapshot: snapshot, events };
    }

    function failSynchronization() {
      Module.ccall("BukClientFailSynchronization", "number", [], []);
      return false;
    }

    function stageSnapshotPresentation(snapshot) {
      const validated = validateGameSnapshot(snapshot);
      if (validated === null) return null;
      const turn = snapshot.current_turn;
      if (Module.ccall(
        "BukClientStageSnapshotMetadata", "number",
        ["string", "string", "string", "string", "string", "string"],
        [snapshot.status, turn.phase, turn.required_input, turn.timer.phase,
          validated.currentTeam, String(turn.timer.remaining_ms)],
      ) !== 1) return null;
      const request = turn.move_request;
      if (request !== null) {
        const routeRequest = routeRequestPresentation(snapshot);
        const normal = request.routes.includes("normal") ? 1 : 0;
        const shortcut = request.routes.includes("shortcut") ? 1 : 0;
        if (request.required_input === "select_route" && routeRequest === null) return null;
        if (Module.ccall(
          "BukClientStageSnapshotMoveRequest", "number",
          ["string", "number", "number", "string"],
          [request.required_input, normal, shortcut, routeRequest?.originSpaceId ?? ""],
        ) !== 1) return null;
      }
      const stackSizeByPieceId = new Map();
      for (const stack of snapshot.stacks) {
        for (const pieceId of stack.piece_ids) stackSizeByPieceId.set(pieceId, stack.piece_ids.length);
      }
      for (const piece of snapshot.pieces) {
        const stackSize = stackSizeByPieceId.get(piece.piece_id) ?? 0;
        if (Module.ccall(
          "BukClientStageSnapshotPiece", "number",
          ["string", "string", "string", "number", "number"],
          [piece.team_id, piece.state, piece.current_space_id ?? "",
            stackSize > 0 ? 1 : 0, stackSize],
        ) !== 1) return null;
      }
      for (const token of snapshot.result_queue) {
        if (Module.ccall(
          "BukClientStageSnapshotResult", "number", ["string"], [token.result],
        ) !== 1) return null;
      }
      return {
        pieceIds: snapshot.pieces.map((piece) => piece.piece_id),
        routeRequest: routeRequestPresentation(snapshot),
      };
    }

    function applySynchronizationSequenceBundle(message) {
      Module.ccall("BukClientBeginSynchronization", "number", [], []);
      const sequences = synchronizationSequences(message);
      if (sequences === null) return failSynchronization();
      if (Module.ccall(
        "BukClientApplySnapshotSequence", "number", ["string"],
        [String(sequences.baseSnapshot.sequence)],
      ) !== 1) return failSynchronization();
      for (const event of sequences.events) {
        if (Module.ccall(
          "BukClientApplyReducedEventSequence", "number", ["string"],
          [String(event.sequence)],
        ) !== 1) return failSynchronization();
      }
      const pendingPresentation = stageSnapshotPresentation(sequences.snapshot);
      if (pendingPresentation === null) return failSynchronization();
      if (Module.ccall("BukClientCompleteSynchronization", "number", [], []) !== 1) {
        return failSynchronization();
      }
      confirmedSnapshotPieceIds = pendingPresentation.pieceIds;
      confirmedRouteRequest = pendingPresentation.routeRequest;
      lastGameEventSequence = sequences.snapshot.sequence;
      renderMatchSession(sequences.snapshot);
      clearEventCue();
      if (wasmRuntimeReady) Module.ccall("BukClientClearEventCue", "number", [], []);
      refreshRouteInteraction();
      return true;
    }

    function drainRouteSelectionIntent() {
      if (!wasmRuntimeReady) return false;
      const route = Module.ccall("BukClientConsumeRouteSelection", "string", [], []);
      if (route.length === 0) return false;
      const request = confirmedRouteRequest;
      const scope = stateReconnectScope;
      if (request === null || scope === null || !request.routes.includes(route)
          || request.roomId !== scope.roomId || request.matchId !== scope.matchId
          || pendingRouteCommands.size !== 0) {
        Module.ccall("BukClientResolveRouteCommand", "number", [], []);
        refreshRouteInteraction();
        return false;
      }
      const commandID = crypto.randomUUID();
      const command = {
        version: 1,
        direction: "client_command",
        type: "SELECT_ROUTE",
        command_id: commandID,
        room_id: request.roomId,
        match_id: request.matchId,
        payload: { token_id: request.tokenId, piece_id: request.pieceId, route },
      };
      if (!sendStateChangingCommand(command)) {
        Module.ccall("BukClientResolveRouteCommand", "number", [], []);
        refreshRouteInteraction();
        return false;
      }
      pendingRouteCommands.set(commandID, { roomId: request.roomId, matchId: request.matchId });
      realtimeStatus.textContent = "지름길 선택 서버 확인 중…";
      return true;
    }

    function setChatAvailable(available) {
      chatInput.disabled = !available;
      chatSend.disabled = !available;
    }

    function appendChatMessage(message) {
      const item = document.createElement("li");
      const sender = document.createElement("strong");
      sender.textContent = message.sender_nickname;
      item.append(sender, document.createTextNode(`: ${message.text}`));
      chatMessages.append(item);
      while (chatMessages.childElementCount > MAX_RENDERED_CHAT_MESSAGES) {
        chatMessages.firstElementChild.remove();
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleRealtimeMessage(socket, event) {
      if (realtimeSocket !== socket || typeof event.data !== "string") return;
      let message;
      try {
        message = JSON.parse(event.data);
      } catch (error) {
        console.error("Invalid realtime JSON", error);
        return;
      }
      if (message.version !== 1) return;
      if (message.direction === "server_response" && message.type === "COMMAND_RESULT"
          && pendingRouteCommands.has(message.command_id)) {
        const expectedScope = pendingRouteCommands.get(message.command_id);
        pendingRouteCommands.delete(message.command_id);
        const scopeMatches = message.room_id === expectedScope.roomId
          && message.match_id === expectedScope.matchId;
        if (scopeMatches && message.payload?.status === "accepted") {
          realtimeStatus.textContent = "지름길 선택 확정, 상태 동기화 중…";
          requestStateSynchronization(false);
        } else {
          Module.ccall("BukClientResolveRouteCommand", "number", [], []);
          refreshRouteInteraction();
          realtimeStatus.textContent = scopeMatches
            ? (message.payload?.error?.message ?? "지름길 선택이 거부됐습니다.")
            : "지름길 선택 응답 범위가 일치하지 않습니다.";
        }
        return;
      }
      if (message.direction === "server_response" && message.type === "COMMAND_RESULT"
          && pendingSynchronizationCommands.has(message.command_id)) {
        const expectedScope = pendingSynchronizationCommands.get(message.command_id);
        pendingSynchronizationCommands.delete(message.command_id);
        if (message.room_id !== expectedScope.roomId
            || message.match_id !== expectedScope.matchId) {
          Module.ccall("BukClientBeginSynchronization", "number", [], []);
          Module.ccall("BukClientApplySnapshotSequence", "number", ["string"], ["0"]);
          realtimeStatus.textContent = "실시간 서버 상태 동기화 실패";
          return;
        }
        if (message.payload?.status === "accepted"
            && applySynchronizationSequenceBundle(message)) {
          fullResynchronizationAttempted = false;
          realtimeStatus.textContent = "실시간 서버 상태 동기화 완료";
        } else if (message.payload?.error?.code === "RESYNC_REQUIRED"
                   && !fullResynchronizationAttempted) {
          fullResynchronizationAttempted = true;
          requestStateSynchronization(true);
        } else {
          realtimeStatus.textContent = "실시간 서버 상태 동기화 실패";
        }
        return;
      }
      if (message.direction === "server_response" && message.type === "COMMAND_RESULT"
          && pendingLobbyCommands.has(message.command_id)) {
        const expectedRoomID = pendingLobbyCommands.get(message.command_id);
        pendingLobbyCommands.delete(message.command_id);
        if (message.room_id !== expectedRoomID || message.room_id !== activeRoomId) return;
        if (message.payload?.status === "accepted") {
          roomLobbyStatus.textContent = "방 로비 요청이 반영되었습니다.";
          refreshActiveRoomDetail();
        } else {
          roomLobbyStatus.textContent = message.payload?.error?.message ?? "방 로비 요청이 거부되었습니다.";
        }
        return;
      }
      if (message.direction === "server_response" && message.type === "COMMAND_RESULT"
          && pendingStartConfirmationCommands.has(message.command_id)) {
        const expectedScope = pendingStartConfirmationCommands.get(message.command_id);
        pendingStartConfirmationCommands.delete(message.command_id);
        if (message.room_id !== expectedScope.roomId || message.match_id !== expectedScope.matchId
            || message.room_id !== activeRoomId || activeStartScope?.matchId !== expectedScope.matchId) return;
        if (message.payload?.status === "accepted") {
          roomLobbyStatus.textContent = "시작 확인이 서버에 반영되었습니다.";
        } else {
          roomLobbyStatus.textContent = message.payload?.error?.message ?? "시작 확인이 거부되었습니다.";
          roomConfirmStart.disabled = activeRoomRole !== "player";
        }
        return;
      }
      if (message.direction === "server_event" && message.room_id === activeRoomId
          && message.type === "ROOM_UPDATED" && Number.isSafeInteger(message.sequence)
          && message.sequence >= 1 && ["lobby", "starting", "in_match", "post_match", "closed"].includes(message.payload?.status)) {
        // The server emits ROOM_UPDATED(in_match) before GAME_STARTED, so retain
        // the start scope for that event. Every other terminal/failed start state
        // must discard it rather than allowing a stale confirmation command.
        if (["lobby", "post_match", "closed"].includes(message.payload.status)) {
          activeStartScope = null;
          clearStateReconnectScope();
        }
        roomLobbyStatus.textContent = "방 상태가 변경되어 동기화 중…";
        refreshActiveRoomDetail();
        return;
      }
      if (message.direction === "server_event" && message.room_id === activeRoomId
          && message.type === "GAME_STARTING" && typeof message.match_id === "string"
          && message.match_id.length > 0 && typeof message.payload?.confirmation_deadline_at === "string") {
        activeStartScope = { roomId: message.room_id, matchId: message.match_id };
        roomConfirmStart.disabled = activeRoomRole !== "player";
        roomLobbyStatus.textContent = "게임 시작 확인이 진행 중입니다.";
        refreshActiveRoomDetail();
        return;
      }
      if (message.version === 1 && message.direction === "server_event"
          && message.room_id === activeRoomId && message.type === "GAME_STARTED"
          && Number.isSafeInteger(message.sequence) && message.sequence >= 1
          && typeof message.match_id === "string" && message.match_id.length > 0
          && typeof message.payload?.first_player_id === "string" && message.payload.first_player_id.length > 0
          && (message.payload.buk_destination_space_id === null
              || (typeof message.payload.buk_destination_space_id === "string"
                  && message.payload.buk_destination_space_id.length > 0))
          && activeStartScope?.roomId === message.room_id && activeStartScope.matchId === message.match_id) {
        activeStartScope = null;
        roomConfirmStart.disabled = true;
        gameSession.hidden = false;
        gameSessionTitle.textContent = "게임 화면";
        gameSessionStatus.textContent = "서버 권위 경기 상태를 동기화하는 중…";
        setStateReconnectScope(message.room_id, message.match_id);
        return;
      }
      if (message.direction === "server_event" && message.type === "MOVE_REQUIRED"
          && stateReconnectScope !== null
          && message.room_id === stateReconnectScope.roomId
          && message.match_id === stateReconnectScope.matchId
          && Number.isSafeInteger(message.sequence) && message.sequence >= 1) {
        requestStateSynchronization(false);
        return;
      }
      if (message.direction === "server_event"
          && (message.type === "PIECE_MOVED" || message.type === "BUK_RESOLVED")) {
        acceptGameEventCue(message);
        return;
      }
      if (message.room_id !== LOBBY_CHAT_ROOM_ID) return;
      if (message.direction === "server_event" && message.type === "CHAT_MESSAGE") {
        const payload = message.payload;
        if (!Number.isInteger(message.sequence) || message.sequence < 1
            || typeof payload?.sender_user_id !== "string"
            || typeof payload?.sender_nickname !== "string"
            || typeof payload?.text !== "string") return;
        appendChatMessage(payload);
        return;
      }
      if (message.direction !== "server_response" || message.type !== "COMMAND_RESULT"
          || !pendingChatCommands.delete(message.command_id)) return;
      if (message.payload?.status === "accepted") {
        chatStatus.textContent = "메시지가 서버에서 확정됐습니다.";
      } else {
        chatStatus.textContent = message.payload?.error?.message ?? "메시지가 거부됐습니다.";
      }
    }

    function loadGoogleIdentityServices() {
      if (window.google?.accounts?.id) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://accounts.google.com/gsi/client";
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error("Google Identity Services load failed"));
        document.head.appendChild(script);
      });
    }

    async function handleGoogleCredential(response) {
      try {
        authStatus.textContent = "Google ID 토큰 검증 중…";
        const loginResponse = await fetch("/api/v1/auth/google", {
          method: "POST",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Buk-Request": "1",
          },
          body: JSON.stringify({ credential: response.credential }),
        });
        if (!loginResponse.ok) throw new Error("Google credential rejected");
        const session = await loginResponse.json();
        showAuthenticated(session.user_id);
      } catch (error) {
        console.error(error);
        authStatus.textContent = "로그인에 실패했습니다.";
      }
    }

    async function initializeGoogleButton() {
      const configResponse = await fetch("/api/v1/auth/config", {
        credentials: "same-origin",
        cache: "no-store",
      });
      if (!configResponse.ok) {
        authStatus.textContent = "인증 서버 미연결 (WASM 단독 모드)";
        return;
      }
      const config = await configResponse.json();
      await loadGoogleIdentityServices();
      google.accounts.id.initialize({
        client_id: config.google_client_id,
        callback: handleGoogleCredential,
      });
      google.accounts.id.renderButton(googleSignin, {
        theme: "outline",
        size: "large",
        text: "signin_with",
      });
      authStatus.textContent = "Google 로그인이 필요합니다.";
    }

    async function initializeAuth() {
      try {
        const response = await fetch("/api/v1/auth/session", {
          credentials: "same-origin",
          cache: "no-store",
        });
        if (response.ok) {
          const session = await response.json();
          showAuthenticated(session.user_id);
          return;
        }
        await initializeGoogleButton();
      } catch (error) {
        console.error(error);
        authStatus.textContent = "인증 초기화에 실패했습니다.";
      }
    }

    logout.addEventListener("click", async () => {
      try {
        const response = await fetch("/api/v1/auth/session", {
          method: "DELETE",
          credentials: "same-origin",
          cache: "no-store",
          headers: { "X-Buk-Request": "1" },
        });
        if (!response.ok) throw new Error("Logout rejected");
        disconnectRealtime();
        authenticatedUserId = null;
        clearStateReconnectScope();
        clearRoomList();
        logout.hidden = true;
        googleSignin.hidden = false;
        googleSignin.replaceChildren();
        await initializeGoogleButton();
      } catch (error) {
        console.error(error);
        authStatus.textContent = "로그아웃에 실패했습니다.";
      }
    });

    function syncInputToWasm() {
      const accepted = Module.ccall(
        "BukClientSetInput",
        "number",
        ["string"],
        [input.value],
      );

      if (!accepted) {
        status.textContent = "입력이 C 클라이언트 버퍼 한도를 초과했습니다.";
        return;
      }

      echo.textContent = Module.ccall("BukClientGetInput", "string", [], []);
      status.textContent = "HTML → C/WASM → HTML UTF-8 왕복 성공";
    }

    input.addEventListener("compositionstart", () => { composing = true; });
    input.addEventListener("compositionend", () => {
      composing = false;
      syncInputToWasm();
    });
    input.addEventListener("input", () => {
      if (!composing) syncInputToWasm();
    });

    chatInput.addEventListener("compositionstart", () => { chatComposing = true; });
    chatInput.addEventListener("compositionend", () => { chatComposing = false; });
    chatInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (chatComposing || event.isComposing)) {
        event.preventDefault();
      }
    });
    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const socket = realtimeSocket;
      if (chatComposing || !socket || socket.readyState !== WebSocket.OPEN) return;
      const text = chatInput.value;
      const length = Array.from(text).length;
      if (length < 1 || length > MAX_CHAT_CODE_POINTS) {
        chatStatus.textContent = "채팅은 1자 이상 200자 이하로 입력하세요.";
        return;
      }
      const commandID = crypto.randomUUID();
      pendingChatCommands.add(commandID);
      socket.send(JSON.stringify({
        version: 1,
        direction: "client_command",
        type: "SEND_CHAT",
        command_id: commandID,
        room_id: LOBBY_CHAT_ROOM_ID,
        payload: { text },
      }));
      chatInput.value = "";
      chatStatus.textContent = "서버 확인 중…";
      chatInput.focus();
    });

    var Module = {
      canvas: document.getElementById("canvas"),
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      onRuntimeInitialized: () => {
        wasmRuntimeReady = true;
        if (routeIntentTimer === null) {
          routeIntentTimer = setInterval(drainRouteSelectionIntent, 50);
        }
        refreshRouteInteraction();
        input.disabled = false;
        status.textContent = "WASM 준비 완료";
        input.focus();
      },
    };

    initializeAuth();
  </script>
