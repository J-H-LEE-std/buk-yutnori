<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>북윷놀이 WASM 프로토타입</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #241d19;
      color: #fffaf0;
    }

    * { box-sizing: border-box; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 960px);
    }

    .auth {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      margin-bottom: 14px;
    }

    .auth-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      padding: 9px 14px;
      border: 1px solid #ad8e78;
      border-radius: 8px;
      background: #fffaf0;
      color: #241d19;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #f5efe1;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgb(0 0 0 / 35%);
    }

    .bridge {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .chat {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #6f5b4e;
      border-radius: 12px;
      background: rgb(255 250 240 / 8%);
    }

    .chat h2 { margin: 0; font-size: 1.05rem; }

    #chat-messages {
      min-height: 96px;
      max-height: 220px;
      margin: 0;
      padding: 12px 12px 12px 32px;
      overflow-y: auto;
      border-radius: 8px;
      background: rgb(0 0 0 / 22%);
    }

    #chat-messages li { margin: 4px 0; overflow-wrap: anywhere; }

    #chat-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    label { font-weight: 700; }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ad8e78;
      border-radius: 8px;
      font: inherit;
    }

    output {
      min-height: 1.5em;
      color: #d7f2e5;
      overflow-wrap: anywhere;
    }

    #status { color: #d6c4b7; }
    #realtime-status { display: block; color: #d6c4b7; }
    #chat-status { color: #d6c4b7; }
  </style>
</head>
<body>
  <main>
    <section class="auth" aria-label="로그인">
      <div>
        <span id="auth-status" role="status">세션 확인 중…</span>
        <span id="realtime-status" role="status">로그인 후 실시간 연결</span>
      </div>
      <div class="auth-actions">
        <div id="google-signin"></div>
        <button id="logout" type="button" hidden>로그아웃</button>
      </div>
    </section>
    <canvas id="canvas" width="960" height="540" tabindex="-1"
            oncontextmenu="event.preventDefault()"></canvas>
    <section class="bridge" aria-labelledby="ime-label">
      <label id="ime-label" for="ime-input">한글 IME → C/WASM 왕복 확인</label>
      <input id="ime-input" type="text" maxlength="200" autocomplete="off"
             placeholder="예: 안녕하세요, 윷놀이!" disabled>
      <output id="echo" for="ime-input" aria-live="polite"></output>
      <span id="status" role="status">WASM 초기화 중…</span>
    </section>
    <section class="chat" aria-labelledby="chat-heading">
      <h2 id="chat-heading">프로토타입 전체 채팅</h2>
      <ol id="chat-messages" aria-live="polite" aria-label="채팅 메시지"></ol>
      <form id="chat-form">
        <label class="visually-hidden" for="chat-input">채팅 메시지</label>
        <input id="chat-input" type="text" autocomplete="off"
               placeholder="한국어 메시지 (최대 200자)" disabled>
        <button id="chat-send" type="submit" disabled>전송</button>
      </form>
      <span id="chat-status" role="status">로그인 후 채팅할 수 있습니다.</span>
    </section>
  </main>

  <script>
    const input = document.getElementById("ime-input");
    const echo = document.getElementById("echo");
    const status = document.getElementById("status");
    const authStatus = document.getElementById("auth-status");
    const realtimeStatus = document.getElementById("realtime-status");
    const googleSignin = document.getElementById("google-signin");
    const logout = document.getElementById("logout");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const chatSend = document.getElementById("chat-send");
    const chatMessages = document.getElementById("chat-messages");
    const chatStatus = document.getElementById("chat-status");
    const PROTOTYPE_ROOM_ID = "prototype-room";
    const MAX_CHAT_CODE_POINTS = 200;
    const MAX_RENDERED_CHAT_MESSAGES = 100;
    const REALTIME_RECONNECT_DELAYS_MS = [250, 500, 1000, 2000, 5000];
    let composing = false;
    let chatComposing = false;
    let realtimeSocket = null;
    let realtimeReconnectEnabled = false;
    let realtimeReconnectAttempt = 0;
    let realtimeReconnectTimer = null;
    let stateReconnectScope = null;
    let fullResynchronizationAttempted = false;
    const pendingChatCommands = new Set();
    const pendingSynchronizationCommands = new Map();

    function reconnectDelayForAttempt(attempt) {
      if (!Number.isInteger(attempt) || attempt < 0
          || attempt >= REALTIME_RECONNECT_DELAYS_MS.length) return null;
      return REALTIME_RECONNECT_DELAYS_MS[attempt];
    }

    function clearRealtimeReconnectTimer() {
      if (realtimeReconnectTimer === null) return;
      clearTimeout(realtimeReconnectTimer);
      realtimeReconnectTimer = null;
    }

    function scheduleRealtimeReconnect() {
      if (!realtimeReconnectEnabled || realtimeReconnectTimer !== null) return false;
      const delay = reconnectDelayForAttempt(realtimeReconnectAttempt);
      if (delay === null) {
        realtimeStatus.textContent = "실시간 서버 자동 재연결 중단";
        chatStatus.textContent = "새로고침 후 다시 연결해 주세요.";
        return false;
      }
      realtimeReconnectAttempt += 1;
      realtimeStatus.textContent = `실시간 서버 재연결 대기 (${delay}ms)`;
      realtimeReconnectTimer = setTimeout(() => {
        realtimeReconnectTimer = null;
        connectRealtime();
      }, delay);
      return true;
    }

    function isDOMTextInput(target) {
      return target instanceof Element && target.closest(
        "input, textarea, [contenteditable]:not([contenteditable='false'])",
      ) !== null;
    }

    function keepTextEditingInDOM(event) {
      if (isDOMTextInput(event.target)) event.stopImmediatePropagation();
    }

    // Emscripten GLFW listens on window during capture and prevents the
    // default Backspace and Tab actions. Register first so DOM-owned text
    // fields keep native browser editing while canvas keyboard input still
    // reaches raylib.
    for (const eventType of ["keydown", "keypress", "keyup"]) {
      window.addEventListener(eventType, keepTextEditingInDOM, true);
    }

    function showAuthenticated(userId) {
      authStatus.textContent = `로그인됨: ${userId}`;
      googleSignin.hidden = true;
      logout.hidden = false;
      realtimeReconnectEnabled = true;
      realtimeReconnectAttempt = 0;
      connectRealtime();
    }

    function connectRealtime() {
      if (realtimeSocket
          && (realtimeSocket.readyState === WebSocket.CONNECTING
              || realtimeSocket.readyState === WebSocket.OPEN)) {
        return;
      }
      const scheme = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${scheme}//${window.location.host}/api/v1/ws`);
      realtimeSocket = socket;
      clearRealtimeReconnectTimer();
      realtimeStatus.textContent = "실시간 서버 연결 중…";
      socket.addEventListener("open", () => {
        if (realtimeSocket !== socket) return;
        realtimeReconnectAttempt = 0;
        fullResynchronizationAttempted = false;
        realtimeStatus.textContent = "실시간 서버 연결됨";
        setChatAvailable(true);
        chatStatus.textContent = "prototype-room 전체 채팅에 연결됐습니다.";
        if (stateReconnectScope !== null) requestStateSynchronization(false);
      });
      socket.addEventListener("message", (event) => { handleRealtimeMessage(socket, event); });
      socket.addEventListener("close", () => {
        if (realtimeSocket !== socket) return;
        realtimeSocket = null;
        realtimeStatus.textContent = "실시간 서버 연결 끊김";
        setChatAvailable(false);
        pendingChatCommands.clear();
        pendingSynchronizationCommands.clear();
        chatStatus.textContent = "채팅 연결이 끊겼습니다.";
        scheduleRealtimeReconnect();
      });
      socket.addEventListener("error", () => {
        if (realtimeSocket !== socket) return;
        realtimeStatus.textContent = "실시간 서버 연결 실패";
        setChatAvailable(false);
      });
    }

    function disconnectRealtime() {
      const socket = realtimeSocket;
      realtimeReconnectEnabled = false;
      realtimeReconnectAttempt = 0;
      clearRealtimeReconnectTimer();
      realtimeSocket = null;
      if (socket) socket.close(1000, "logout");
      realtimeStatus.textContent = "로그인 후 실시간 연결";
      setChatAvailable(false);
      pendingChatCommands.clear();
      pendingSynchronizationCommands.clear();
      chatStatus.textContent = "로그인 후 채팅할 수 있습니다.";
    }

    function setStateReconnectScope(roomId, matchId) {
      if (typeof roomId !== "string" || roomId.length < 1
          || typeof matchId !== "string" || matchId.length < 1) return false;
      pendingSynchronizationCommands.clear();
      stateReconnectScope = { roomId, matchId };
      fullResynchronizationAttempted = false;
      Module.ccall("BukClientBeginSynchronization", "number", [], []);
      if (realtimeSocket?.readyState === WebSocket.OPEN) {
        requestStateSynchronization(false);
      }
      return true;
    }

    function clearStateReconnectScope() {
      stateReconnectScope = null;
      pendingSynchronizationCommands.clear();
      fullResynchronizationAttempted = false;
    }

    function canSendStateChangingCommand() {
      return realtimeSocket?.readyState === WebSocket.OPEN
        && Module.ccall("BukClientCanSendStateCommands", "number", [], []) === 1;
    }

    function sendStateChangingCommand(command) {
      if (!canSendStateChangingCommand() || command === null || typeof command !== "object") {
        return false;
      }
      realtimeSocket.send(JSON.stringify(command));
      return true;
    }

    function requestStateSynchronization(full) {
      const socket = realtimeSocket;
      if (stateReconnectScope === null || !socket || socket.readyState !== WebSocket.OPEN) {
        return false;
      }
      const lastSequenceText = full
        ? "0"
        : Module.ccall("BukClientLastSequence", "string", [], []);
      const lastSequence = Number(lastSequenceText);
      if (!Number.isSafeInteger(lastSequence) || lastSequence < 0) return false;
      Module.ccall("BukClientBeginSynchronization", "number", [], []);
      const commandID = crypto.randomUUID();
      pendingSynchronizationCommands.set(commandID, {
        roomId: stateReconnectScope.roomId,
        matchId: stateReconnectScope.matchId,
      });
      socket.send(JSON.stringify({
        version: 1,
        direction: "client_command",
        type: "RECONNECT",
        command_id: commandID,
        room_id: stateReconnectScope.roomId,
        match_id: stateReconnectScope.matchId,
        payload: { last_sequence: lastSequence },
      }));
      return true;
    }

    function synchronizationSequences(message) {
      if (message?.version !== 1 || message.direction !== "server_response"
          || message.type !== "COMMAND_RESULT" || message.payload?.status !== "accepted"
          || typeof message.room_id !== "string" || typeof message.match_id !== "string") {
        return null;
      }
      const synchronization = message.payload?.synchronization;
      const snapshot = synchronization?.snapshot;
      const events = synchronization?.events;
      if (!snapshot || !Array.isArray(events)
          || snapshot.room_id !== message.room_id
          || snapshot.match_id !== message.match_id
          || !Number.isSafeInteger(snapshot.sequence) || snapshot.sequence < 1) return null;
      const sequences = [];
      let expected = snapshot.sequence;
      for (const serverEvent of events) {
        expected += 1;
        if (serverEvent?.version !== 1 || serverEvent.direction !== "server_event"
            || typeof serverEvent.type !== "string"
            || !Number.isSafeInteger(serverEvent.sequence) || serverEvent.sequence !== expected
            || serverEvent.room_id !== message.room_id
            || (serverEvent.match_id != null && serverEvent.match_id !== message.match_id)) {
          return null;
        }
        sequences.push(serverEvent.sequence);
      }
      return { snapshot: snapshot.sequence, events: sequences };
    }

    function applySynchronizationSequenceBundle(message) {
      Module.ccall("BukClientBeginSynchronization", "number", [], []);
      const sequences = synchronizationSequences(message);
      if (sequences === null) {
        Module.ccall("BukClientApplySnapshotSequence", "number", ["string"], ["0"]);
        return false;
      }
      if (Module.ccall(
        "BukClientApplySnapshotSequence", "number", ["string"], [String(sequences.snapshot)],
      ) !== 1) return false;
      for (const sequence of sequences.events) {
        if (Module.ccall(
          "BukClientApplyEventSequence", "number", ["string"], [String(sequence)],
        ) !== 1) return false;
      }
      return Module.ccall("BukClientCompleteSynchronization", "number", [], []) === 1;
    }

    function setChatAvailable(available) {
      chatInput.disabled = !available;
      chatSend.disabled = !available;
    }

    function appendChatMessage(message) {
      const item = document.createElement("li");
      const sender = document.createElement("strong");
      sender.textContent = message.sender_user_id;
      item.append(sender, document.createTextNode(`: ${message.text}`));
      chatMessages.append(item);
      while (chatMessages.childElementCount > MAX_RENDERED_CHAT_MESSAGES) {
        chatMessages.firstElementChild.remove();
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleRealtimeMessage(socket, event) {
      if (realtimeSocket !== socket || typeof event.data !== "string") return;
      let message;
      try {
        message = JSON.parse(event.data);
      } catch (error) {
        console.error("Invalid realtime JSON", error);
        return;
      }
      if (message.version !== 1) return;
      if (message.direction === "server_response" && message.type === "COMMAND_RESULT"
          && pendingSynchronizationCommands.has(message.command_id)) {
        const expectedScope = pendingSynchronizationCommands.get(message.command_id);
        pendingSynchronizationCommands.delete(message.command_id);
        if (message.room_id !== expectedScope.roomId
            || message.match_id !== expectedScope.matchId) {
          Module.ccall("BukClientBeginSynchronization", "number", [], []);
          Module.ccall("BukClientApplySnapshotSequence", "number", ["string"], ["0"]);
          realtimeStatus.textContent = "실시간 서버 상태 동기화 실패";
          return;
        }
        if (message.payload?.status === "accepted"
            && applySynchronizationSequenceBundle(message)) {
          fullResynchronizationAttempted = false;
          realtimeStatus.textContent = "실시간 서버 상태 동기화 완료";
        } else if (message.payload?.error?.code === "RESYNC_REQUIRED"
                   && !fullResynchronizationAttempted) {
          fullResynchronizationAttempted = true;
          requestStateSynchronization(true);
        } else {
          realtimeStatus.textContent = "실시간 서버 상태 동기화 실패";
        }
        return;
      }
      if (message.room_id !== PROTOTYPE_ROOM_ID) return;
      if (message.direction === "server_event" && message.type === "CHAT_MESSAGE") {
        const payload = message.payload;
        if (!Number.isInteger(message.sequence) || message.sequence < 1
            || typeof payload?.sender_user_id !== "string"
            || typeof payload?.text !== "string") return;
        appendChatMessage(payload);
        return;
      }
      if (message.direction !== "server_response" || message.type !== "COMMAND_RESULT"
          || !pendingChatCommands.delete(message.command_id)) return;
      if (message.payload?.status === "accepted") {
        chatStatus.textContent = "메시지가 서버에서 확정됐습니다.";
      } else {
        chatStatus.textContent = message.payload?.error?.message ?? "메시지가 거부됐습니다.";
      }
    }

    function loadGoogleIdentityServices() {
      if (window.google?.accounts?.id) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://accounts.google.com/gsi/client";
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error("Google Identity Services load failed"));
        document.head.appendChild(script);
      });
    }

    async function handleGoogleCredential(response) {
      try {
        authStatus.textContent = "Google ID 토큰 검증 중…";
        const loginResponse = await fetch("/api/v1/auth/google", {
          method: "POST",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Buk-Request": "1",
          },
          body: JSON.stringify({ credential: response.credential }),
        });
        if (!loginResponse.ok) throw new Error("Google credential rejected");
        const session = await loginResponse.json();
        showAuthenticated(session.user_id);
      } catch (error) {
        console.error(error);
        authStatus.textContent = "로그인에 실패했습니다.";
      }
    }

    async function initializeGoogleButton() {
      const configResponse = await fetch("/api/v1/auth/config", {
        credentials: "same-origin",
        cache: "no-store",
      });
      if (!configResponse.ok) {
        authStatus.textContent = "인증 서버 미연결 (WASM 단독 모드)";
        return;
      }
      const config = await configResponse.json();
      await loadGoogleIdentityServices();
      google.accounts.id.initialize({
        client_id: config.google_client_id,
        callback: handleGoogleCredential,
      });
      google.accounts.id.renderButton(googleSignin, {
        theme: "outline",
        size: "large",
        text: "signin_with",
      });
      authStatus.textContent = "Google 로그인이 필요합니다.";
    }

    async function initializeAuth() {
      try {
        const response = await fetch("/api/v1/auth/session", {
          credentials: "same-origin",
          cache: "no-store",
        });
        if (response.ok) {
          const session = await response.json();
          showAuthenticated(session.user_id);
          return;
        }
        await initializeGoogleButton();
      } catch (error) {
        console.error(error);
        authStatus.textContent = "인증 초기화에 실패했습니다.";
      }
    }

    logout.addEventListener("click", async () => {
      try {
        const response = await fetch("/api/v1/auth/session", {
          method: "DELETE",
          credentials: "same-origin",
          cache: "no-store",
          headers: { "X-Buk-Request": "1" },
        });
        if (!response.ok) throw new Error("Logout rejected");
        disconnectRealtime();
        logout.hidden = true;
        googleSignin.hidden = false;
        googleSignin.replaceChildren();
        await initializeGoogleButton();
      } catch (error) {
        console.error(error);
        authStatus.textContent = "로그아웃에 실패했습니다.";
      }
    });

    function syncInputToWasm() {
      const accepted = Module.ccall(
        "BukClientSetInput",
        "number",
        ["string"],
        [input.value],
      );

      if (!accepted) {
        status.textContent = "입력이 C 클라이언트 버퍼 한도를 초과했습니다.";
        return;
      }

      echo.textContent = Module.ccall("BukClientGetInput", "string", [], []);
      status.textContent = "HTML → C/WASM → HTML UTF-8 왕복 성공";
    }

    input.addEventListener("compositionstart", () => { composing = true; });
    input.addEventListener("compositionend", () => {
      composing = false;
      syncInputToWasm();
    });
    input.addEventListener("input", () => {
      if (!composing) syncInputToWasm();
    });

    chatInput.addEventListener("compositionstart", () => { chatComposing = true; });
    chatInput.addEventListener("compositionend", () => { chatComposing = false; });
    chatInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (chatComposing || event.isComposing)) {
        event.preventDefault();
      }
    });
    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const socket = realtimeSocket;
      if (chatComposing || !socket || socket.readyState !== WebSocket.OPEN) return;
      const text = chatInput.value;
      const length = Array.from(text).length;
      if (length < 1 || length > MAX_CHAT_CODE_POINTS) {
        chatStatus.textContent = "채팅은 1자 이상 200자 이하로 입력하세요.";
        return;
      }
      const commandID = crypto.randomUUID();
      pendingChatCommands.add(commandID);
      socket.send(JSON.stringify({
        version: 1,
        direction: "client_command",
        type: "SEND_CHAT",
        command_id: commandID,
        room_id: PROTOTYPE_ROOM_ID,
        payload: { text },
      }));
      chatInput.value = "";
      chatStatus.textContent = "서버 확인 중…";
      chatInput.focus();
    });

    var Module = {
      canvas: document.getElementById("canvas"),
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      onRuntimeInitialized: () => {
        input.disabled = false;
        status.textContent = "WASM 준비 완료";
        input.focus();
      },
    };

    initializeAuth();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
