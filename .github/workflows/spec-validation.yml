name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs / integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_docs.py

  parse:
    name: spec / parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/validate_specs.py parse

  contracts:
    name: spec / contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/validate_specs.py contracts

  board:
    name: spec / board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/validate_specs.py board

  release-policy:
    name: release / validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tools/check_release_tag_policy_test.py

  client-assets:
    name: client / asset contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tools/check_assets_test.py

  go:
    name: go / quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: go.sum
      - name: Verify module files
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if test -n "$unformatted"; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Run vet
        run: go vet ./...
      - name: Run tests with race detector
        run: go test -race -count=1 ./...

  client-native:
    name: client / native tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run C client tests
        run: make -C client test

  client-wasm:
    name: client / wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned raylib
        uses: actions/checkout@v4
        with:
          repository: raysan5/raylib
          ref: dbc56a87da87d973a9c5baa4e7438a9d20121d28
          path: external/raylib
          persist-credentials: false
      - name: Check out pinned Emscripten SDK
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: 56a2c6e3681497b04edfd0a7972e6d435b266114
          path: .tools/emsdk
          persist-credentials: false
      - name: Install Emscripten 5.0.4
        run: |
          .tools/emsdk/emsdk install 5.0.4
          .tools/emsdk/emsdk activate 5.0.4
      - name: Build C raylib client for WebAssembly
        run: |
          source .tools/emsdk/emsdk_env.sh
          make -C client wasm
          test -s build/client/web/index.html
          test -s build/client/web/index.js
          test -s build/client/web/index.wasm
      - name: Smoke test WASM initialization in Chrome
        run: |
          python3 -m http.server 8765 --directory build/client/web >/tmp/buk-client-http.log 2>&1 &
          server_pid=$!
          chrome_pid=
          cleanup() {
            if [ -n "$chrome_pid" ]; then kill "$chrome_pid" 2>/dev/null || true; fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://localhost:8765/ >/dev/null
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=5000 --dump-dom http://localhost:8765/ \
            >/tmp/buk-client-dom.html
          grep -q '<span id="status" role="status">WASM 준비 완료</span>' /tmp/buk-client-dom.html
          grep -q '<span id="auth-status" role="status">인증 서버 미연결 (WASM 단독 모드)</span>' /tmp/buk-client-dom.html
          grep -q '<span id="realtime-status" role="status">로그인 후 실시간 연결</span>' /tmp/buk-client-dom.html
          chrome_profile=$(mktemp -d)
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --user-data-dir="$chrome_profile" http://localhost:8765/ \
            >/tmp/buk-client-chrome.log 2>&1 &
          chrome_pid=$!
          node client/tests/browser_input_test.mjs \
            http://127.0.0.1:9222 http://localhost:8765/

  required:
    name: ci / required
    if: always()
    needs: [docs, parse, contracts, board, release-policy, client-assets, go, client-native, client-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          PARSE_RESULT: ${{ needs.parse.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          BOARD_RESULT: ${{ needs.board.result }}
          RELEASE_POLICY_RESULT: ${{ needs.release-policy.result }}
          CLIENT_ASSETS_RESULT: ${{ needs.client-assets.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          GO_RESULT: ${{ needs.go.result }}
          CLIENT_NATIVE_RESULT: ${{ needs.client-native.result }}
          CLIENT_WASM_RESULT: ${{ needs.client-wasm.result }}
        run: |
          test "$DOCS_RESULT" = "success"
          test "$PARSE_RESULT" = "success"
          test "$CONTRACTS_RESULT" = "success"
          test "$BOARD_RESULT" = "success"
          test "$RELEASE_POLICY_RESULT" = "success"
          test "$CLIENT_ASSETS_RESULT" = "success"
          test "$GO_RESULT" = "success"
          test "$CLIENT_NATIVE_RESULT" = "success"
          test "$CLIENT_WASM_RESULT" = "success"
