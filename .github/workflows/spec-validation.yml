name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs / integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_docs.py

  parse:
    name: spec / parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/validate_specs.py parse

  contracts:
    name: spec / contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/validate_specs.py contracts

  board:
    name: spec / board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python tools/validate_specs.py board

  go:
    name: go / quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: go.sum
      - name: Verify module files
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if test -n "$unformatted"; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Run vet
        run: go vet ./...
      - name: Run tests with race detector
        run: go test -race -count=1 ./...

  required:
    name: ci / required
    if: always()
    needs: [docs, parse, contracts, board, go]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          PARSE_RESULT: ${{ needs.parse.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          BOARD_RESULT: ${{ needs.board.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          GO_RESULT: ${{ needs.go.result }}
        run: |
          test "$DOCS_RESULT" = "success"
          test "$PARSE_RESULT" = "success"
          test "$CONTRACTS_RESULT" = "success"
          test "$BOARD_RESULT" = "success"
          test "$GO_RESULT" = "success"
