name: Release Tag Policy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  required:
    name: release / tag policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SemVer annotated milestone tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          case "$REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must be vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          python3 - <<'PY'
          import os
          import re
          import subprocess

          tag = os.environ["REF_NAME"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Tag must be strict SemVer vMAJOR.MINOR.PATCH")

          tag_type = subprocess.check_output(
              ["git", "cat-file", "-t", tag],
              text=True,
          ).strip()
          if tag_type != "tag":
              raise SystemExit("Release tags must be annotated tags")

          target = subprocess.check_output(
              ["git", "rev-list", "-n", "1", tag],
              text=True,
          ).strip()
          subprocess.run(["git", "fetch", "origin", "main"], check=True)
          on_main = subprocess.run(
              ["git", "merge-base", "--is-ancestor", target, "origin/main"],
              check=False,
          )
          if on_main.returncode != 0:
              raise SystemExit("Release tag target must be reachable from main")

          print("RELEASE_TAG_POLICY_OK")
          PY
