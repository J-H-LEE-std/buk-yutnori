name: Release Tag Policy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  required:
    name: release / tag policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SemVer annotated milestone tag
        env:
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python tools/check_release_tag_policy.py --tag "$REF_NAME"
